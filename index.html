<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Google tag (gtag.js). Two things are deliberate here:
         send_page_view is off because page views are sent per client-side route
         by src/lib/analytics.ts, and page_location is pinned to a redacted URL
         because our paths carry credentials — /share/<token> IS the credential
         for a public link — and GA4 enhanced measurement (scroll, click, …)
         otherwise reads window.location directly. This must be set at config
         time, before the tag can fire its first automatic event. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TPNYWWNCTR"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      (function () {
        // Mirrors redactPath() in src/lib/analytics.ts.
        var p = location.pathname
          .replace(/^\/meeting\/[^/]+/, '/meeting/:id')
          .replace(/^\/share\/[^/]+/, '/share/:token')
          .replace(/^\/invite\/[^/]+/, '/invite/:token');
        gtag('config', 'G-TPNYWWNCTR', {
          send_page_view: false,
          page_path: p,
          page_location: location.origin + p,
        });
      })();
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EchoBrief - AI Meeting Recorder</title>
    <meta name="description" content="Meeting summaries in 22 Indian languages. Auto-join Meet, Zoom & Teams. Delivered to your inbox." />
    <meta name="author" content="EchoBrief" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#D93F0B" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#120C09" media="(prefers-color-scheme: dark)" />

    <meta property="og:title" content="EchoBrief — Meeting summaries that actually make sense" />
    <meta property="og:description" content="Meeting summaries in 22 Indian languages. Auto-join Meet, Zoom & Teams. Delivered to your inbox." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://www.echobrief.in/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="EchoBrief — every meeting, briefed." />
    <meta property="og:url" content="https://www.echobrief.in/" />
    <meta property="og:site_name" content="EchoBrief" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@EchoBrief" />
    <meta name="twitter:image" content="https://www.echobrief.in/og-image.png" />

    <!-- Fonts: Switzer (body + headings) from Fontshare, JetBrains Mono from Google Fonts -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://api.fontshare.com/v2/css?f[]=switzer@300,400,500,600,700,800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Devanagari:wght@400;500&family=Noto+Sans+Tamil:wght@400;500&display=swap" rel="stylesheet" />
  </head>

  <body>
    <script>
      (function () {
        try {
          var k = 'echobrief-theme';
          var t = localStorage.getItem(k);
          var r = 'dark';
          if (t === 'light') r = 'light';
          else if (t === 'dark') r = 'dark';
          else r = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.classList.add(r);
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
